; Pengaturan PHP produksi (menimpa bawaan image).
date.timezone = UTC
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED
; Kode tidak berubah selama container hidup.
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
