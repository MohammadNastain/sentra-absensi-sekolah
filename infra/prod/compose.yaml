# Stack PRODUKSI satu VPS (2 GB RAM): edge+API, web, worker antrean, scheduler, PostgreSQL, Redis.
# Panduan lengkap: docs/ops/DEPLOY_VPS.md. Dijalankan dari folder ini di server:
#   cp .env.example .env && nano .env      # isi semua nilai bertanda GANTI
#   docker compose pull && docker compose run --rm migrate && docker compose up -d
#
# Hanya `api` (edge) yang membuka port 80/443; database dan Redis tidak punya port publik.
# Batas memori dijumlahkan ±1,5 GB agar muat di VPS 2 GB bersama swap.

name: sentra

x-api: &api
  image: ghcr.io/${GHCR_OWNER:?isi GHCR_OWNER di .env}/sentra-api:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file: .env
  environment: &api-env
    APP_ENV: production
    APP_DEBUG: "false"
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_DATABASE: sentra
    DB_USERNAME: sentra_app
    DB_PASSWORD: ${SENTRA_DB_APP_PASSWORD:?}
    DB_MIGRATION_USERNAME: sentra_owner
    DB_MIGRATION_PASSWORD: ${SENTRA_DB_OWNER_PASSWORD:?}
    REDIS_CLIENT: predis
    REDIS_HOST: redis
    REDIS_PASSWORD: ${REDIS_PASSWORD:?}
    SESSION_DRIVER: redis
    QUEUE_CONNECTION: redis
    CACHE_STORE: redis
    LOG_CHANNEL: stderr
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:18.6-alpine3.23
    restart: unless-stopped
    shm_size: 128mb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?}
      POSTGRES_DB: postgres
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8 --auth-host=scram-sha-256"
      SENTRA_DB_OWNER_PASSWORD: ${SENTRA_DB_OWNER_PASSWORD:?}
      SENTRA_DB_APP_PASSWORD: ${SENTRA_DB_APP_PASSWORD:?}
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      - -c
      - log_min_duration_statement=500
      # Disetel untuk VPS 2 GB (bukan bawaan 128 MB / 100 koneksi).
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=60
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../docker/prod/initdb:/docker-entrypoint-initdb.d:ro
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d sentra"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  redis:
    image: redis:8.2.10-alpine3.22
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?}
      - --appendonly
      - "yes"
      - --maxmemory
      - 128mb
      - --maxmemory-policy
      - noeviction
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    mem_limit: 192m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20

  # Edge: HTTPS, Laravel (/api, /sanctum, /up), dan meneruskan sisanya ke web.
  api:
    <<: *api
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      <<: *api-env
      SITE_ADDRESS: ${SITE_ADDRESS:?}
      ACME_EMAIL: ${ACME_EMAIL:?}
    volumes:
      - api-storage:/app/storage
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:2019/config/') === false ? 1 : 0);"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    image: ghcr.io/${GHCR_OWNER:?}/sentra-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=192
    mem_limit: 256m
    depends_on:
      - api

  # tries=1: undangan sengaja tanpa retry otomatis (ADR 0008). --max-time: worker keluar tiap jam, `restart` menyalakannya lagi.
  queue:
    <<: *api
    healthcheck: {disable: true}
    command: ["php", "artisan", "queue:work", "--tries=1", "--sleep=1", "--max-time=3600", "--queue=default,exports"]
    volumes:
      - api-storage:/app/storage
    mem_limit: 256m

  scheduler:
    <<: *api
    healthcheck: {disable: true}
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - api-storage:/app/storage
    mem_limit: 128m

  # Sekali jalan, di bawah profil: docker compose run --rm migrate
  migrate:
    <<: *api
    profiles: ["tools"]
    healthcheck: {disable: true}
    restart: "no"
    command: ["php", "artisan", "migrate", "--database=pgsql_owner", "--force"]

volumes:
  postgres-data:
  redis-data:
  api-storage:
  caddy-data:
  caddy-config:
