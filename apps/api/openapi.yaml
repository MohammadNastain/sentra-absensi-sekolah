        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceName" }
      responses:
        "200":
          description: "Diubah."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /schools/{school}/devices/{device}/pairing-code:
    post:
      tags: [school]
      operationId: renewDevicePairingCode
      summary: "Buat kode pairing baru untuk perangkat yang belum dipasangkan"
      description: "Izin: school.devices.manage."
      parameters:
        - $ref: "#/components/parameters/SchoolCode"
        - $ref: "#/components/parameters/DeviceId"
      responses:
        "200":
          description: "Kode baru; kode lama tidak berlaku."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DevicePairingEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /schools/{school}/devices/{device}/revoke:
    post:
      tags: [school]
      operationId: revokeDevice
      summary: "Cabut perangkat (alasan wajib, langsung efektif)"
      description: "Izin: school.devices.manage. Request berikutnya dari terminal itu ditolak 403 DEVICE_REVOKED."
      parameters:
        - $ref: "#/components/parameters/SchoolCode"
        - $ref: "#/components/parameters/DeviceId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequired" }
      responses:
        "200":
          description: "Perangkat dicabut."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /terminal/pair:
    post:
      tags: [terminal]
      operationId: pairTerminal
      summary: "Tukar kode pairing dengan token perangkat"
      description: "Tanpa login. Berhasil memasang cookie sentra_device (HttpOnly, SameSite=Strict) berisi token perangkat; token tidak ada di body. Kode sekali pakai, berlaku 10 menit; semua kegagalan 422 PAIRING_CODE_INVALID. Header X-Sentra-Terminal: 1 wajib."
      security: []
      parameters:
        - $ref: "#/components/parameters/TerminalHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerminalPairRequest" }
      responses:
        "200":
          description: "Terminal dipasangkan."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalPairEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /terminal/config:
    get:
      tags: [terminal]
      operationId: getTerminalConfig
      summary: "Konfigurasi terminal"
      description: "Nama sekolah, zona waktu, waktu server, dan metode input aktif. 401 DEVICE_UNPAIRED / 403 DEVICE_REVOKED / 403 SCHOOL_UNAVAILABLE."
      security:
        - deviceCookie: []
      parameters:
        - $ref: "#/components/parameters/TerminalHeader"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalConfigEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /terminal/heartbeat:
    post:
      tags: [terminal]
      operationId: terminalHeartbeat
      summary: "Heartbeat terminal"
      description: "Menandakan terminal masih terhubung dan mengembalikan waktu server."
      security:
        - deviceCookie: []
      parameters:
        - $ref: "#/components/parameters/TerminalHeader"
      responses:
        "200":
          description: "OK"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalHeartbeatEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /terminal/scans:
    post:
      tags: [terminal]
      operationId: recordTerminalScan
      summary: "Catat satu scan QR dari terminal"
      description: "Waktu selalu waktu server. Kunci idempotensi yang sama mengembalikan hasil yang sama tanpa catatan baru. Hasil accepted/duplicate/rejected/needs_review dikembalikan dengan HTTP 200; kode alasan stabil ada di `code`."
      security:
        - deviceCookie: []
      parameters:
        - $ref: "#/components/parameters/TerminalHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TerminalScanRequest" }
      responses:
        "200":
          description: "Hasil scan."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalScanEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /terminal/recent:
    get:
      tags: [terminal]
      operationId: listTerminalRecent
      summary: "Sepuluh transaksi terakhir sekolah"
      description: "Hanya nama tampilan ringkas, tanpa nilai kredensial."
      security:
        - deviceCookie: []
      parameters:
        - $ref: "#/components/parameters/TerminalHeader"
      responses:
        "200":
          description: "Transaksi terakhir."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TerminalRecentEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sentra_session
      description: "Cookie sesi Sanctum SPA. Request tulis juga wajib header X-XSRF-TOKEN."
    deviceCookie:
      type: apiKey
      in: cookie
      name: sentra_device
      description: "Token perangkat terminal (256-bit) dari /terminal/pair. Tanpa sesi dan tanpa CSRF cookie; header X-Sentra-Terminal: 1 wajib."
  parameters:
    Token:
      name: token
      in: path
      required: true
      schema: { type: string, minLength: 43, maxLength: 43 }
    Page:
      name: page
      in: query
      description: Nomor halaman (50 baris per halaman), mulai dari 1.
      schema: { type: integer, minimum: 1, default: 1 }
    SchoolCode:
      name: school
      in: path
      required: true
      description: "Kode sekolah (slug), bukan UUID."
      schema: { type: string }
    MembershipId:
      name: membership
      in: path
      required: true
      schema: { type: string, format: uuid }
    InvitationId:
      name: invitation
      in: path
      required: true
      schema: { type: string, format: uuid }
    AcademicYearId:
      name: academicYear
      in: path
      required: true
      schema: { type: string, format: uuid }
    TeacherId:
      name: teacher
      in: path
      required: true
      schema: { type: string, format: uuid }
    ClassId:
      name: schoolClass
      in: path
      required: true
      schema: { type: string, format: uuid }
    StudentId:
      name: student
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImportId:
      name: import
      in: path
      required: true
      schema: { type: string, format: uuid }
    HolidayId:
      name: holiday
      in: path
      required: true
      schema: { type: string, format: uuid }
    ScheduleId:
      name: schedule
      in: path
      required: true
      schema: { type: string, format: uuid }
    CredentialId:
      name: credential
      in: path
      required: true
      schema: { type: string, format: uuid }
    DeviceId:
      name: device
      in: path
      required: true
      schema: { type: string, format: uuid }
    TerminalHeader:
      name: X-Sentra-Terminal
      in: header
      required: true
      description: "Wajib bernilai 1. Memaksa preflight CORS sehingga halaman origin lain tidak dapat memicu endpoint terminal."
      schema: { type: string, enum: ["1"] }
  responses:
    Unauthenticated:
      description: "Belum login atau sesi berakhir (`UNAUTHENTICATED`, `LOGIN_REQUIRED`)."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: |
        Ditolak. `code`: PERMISSION_DENIED, PLATFORM_ADMIN_REQUIRED, TWO_FACTOR_REQUIRED, MEMBERSHIP_SUSPENDED,
        SCHOOL_UNAVAILABLE, CANNOT_CHANGE_OWN_ROLES, INVITATION_EMAIL_MISMATCH.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: "Tidak ditemukan, atau bukan milik sekolah/user ini (sengaja tidak dibedakan)."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: |
        Konflik. `code`: LAST_SCHOOL_ADMIN, INVALID_STATE_TRANSITION, INVITATION_ALREADY_PENDING, ALREADY_MEMBER,
        ACADEMIC_YEAR_OVERLAP, DUPLICATE_VALUE, ENROLLMENT_CONFLICT, SCHEDULE_CONFLICT.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    InvitationUnavailable:
      description: "Undangan tidak tersedia (`INVITATION_UNAVAILABLE`); semua sebabnya berbentuk sama."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ValidationFailed:
      description: "Validasi gagal (`VALIDATION_FAILED`) dengan `errors` per field."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadRequest:
      description: "Permintaan tidak valid (mis. header terminal hilang)."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: "Dibatasi laju (`TOO_MANY_REQUESTS`)."
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    EmailNotConfigured:
      description: "Transport email belum disiapkan di lingkungan ini (`EMAIL_NOT_CONFIGURED`)."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PasswordConfirmationRequired:
      description: "Konfirmasi password diperlukan terlebih dulu."
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
  schemas:
    Problem:
      type: object
      description: "RFC 9457 problem+json."
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string, description: Kode stabil untuk logika klien. }
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    Message:
      type: object
      properties:
        message: { type: string }
    PageMeta:
      type: object
      required: [current_page, last_page, total]
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        total: { type: integer }
    Role:
      type: string
      enum: [school_admin, principal, homeroom_teacher, duty_officer, terminal_operator]
    Permission:
      type: string
      enum: [school.profile.view, school.profile.update, school.members.view, school.members.manage, school.audit.view, school.academic.view, school.academic.manage, school.students.view, school.students.manage, school.schedule.view, school.schedule.manage, school.credentials.view, school.credentials.manage, school.devices.view, school.devices.manage, school.attendance.view]
    SchoolStatus:
      type: string
      enum: [trial, active, suspended, terminated]
    MembershipStatus:
      type: string
      enum: [active, suspended, ended]
    InvitationStatus:
      type: string
      enum: [pending, accepted, revoked, expired]
    EducationLevel:
      type: string
      enum: [SD, MI, SMP, MTs, SMA, SMK, MA, lainnya]
    Timezone:
      type: string
      enum: [Asia/Jakarta, Asia/Makassar, Asia/Jayapura]
    Me:
      type: object
      required: [id, email, name, two_factor_enabled, is_platform_admin, two_factor_passed]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        two_factor_enabled: { type: boolean }
        is_platform_admin: { type: boolean }
        two_factor_passed: { type: boolean }
    SchoolRef:
      type: object
      required: [code, name]
      properties:
        code: { type: string }
        name: { type: string }
    School:
      type: object
      required: [id, code, npsn, name, education_levels, timezone, address, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        npsn: { type: [string, "null"], pattern: "^[0-9]{8}$" }
        name: { type: string }
        education_levels:
          type: array
          items: { $ref: "#/components/schemas/EducationLevel" }
        timezone: { $ref: "#/components/schemas/Timezone" }
        address: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/SchoolStatus" }
    SchoolEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/School" }
    SchoolCreate:
      type: object
      required: [code, name, education_levels, timezone]
      properties:
        code:
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]{0,38}[a-z0-9])?$"
          description: "Slug unik, tidak bisa diubah setelah dibuat."
        name: { type: string, maxLength: 200 }
        npsn: { type: [string, "null"], pattern: "^[0-9]{8}$" }
        education_levels:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/EducationLevel" }
        timezone: { $ref: "#/components/schemas/Timezone" }
        address: { type: [string, "null"], maxLength: 500 }
        status:
          type: string
          enum: [trial, active]
          description: "Opsional; bila dikosongkan sekolah dibuat dengan status `active`."
    SchoolUpdate:
      type: object
      description: "Semua field opsional. `code` dan `status` ditolak (422)."
      properties:
        name: { type: string, maxLength: 200 }
        npsn: { type: [string, "null"], pattern: "^[0-9]{8}$" }
        education_levels:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/EducationLevel" }
        timezone: { $ref: "#/components/schemas/Timezone" }
        address: { type: [string, "null"], maxLength: 500 }
    SchoolProfile:
      type: object
      required: [code, npsn, name, education_levels, timezone, address, status, my_roles, my_permissions]
      properties:
        code: { type: string }
        npsn: { type: [string, "null"] }
        name: { type: string }
        education_levels:
          type: array
          items: { $ref: "#/components/schemas/EducationLevel" }
        timezone: { $ref: "#/components/schemas/Timezone" }
        address: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/SchoolStatus" }
        my_roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        my_permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
    MySchool:
      type: object
      required: [school, membership_status, roles, permissions]
      properties:
        school:
          type: object
          required: [code, name, status, accessible]
          properties:
            code: { type: string }
            name: { type: string }
            status: { $ref: "#/components/schemas/SchoolStatus" }
            accessible: { type: boolean }
        membership_status: { $ref: "#/components/schemas/MembershipStatus" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
    Member:
      type: object
      required: [id, user, status, status_reason, roles, joined_at, ended_at]
      properties:
        id: { type: string, format: uuid }
        user:
          type: object
          required: [id, name, email]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string, format: email }
        status: { $ref: "#/components/schemas/MembershipStatus" }
        status_reason: { type: [string, "null"] }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        joined_at: { type: string, format: date-time }
        ended_at: { type: [string, "null"], format: date-time }
    MemberEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Member" }
    Invitation:
      type: object
      required: [id, email, roles, status, expires_at, delivery_status, delivery_error, invited_by_user_id, created_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        status: { $ref: "#/components/schemas/InvitationStatus" }
        expires_at: { type: string, format: date-time }
        delivery_status:
          type: string
          enum: [queued, handed_off, failed]
          description: "`handed_off` = transport email menerima pesan, bukan berarti sampai di kotak masuk."
        delivery_error: { type: [string, "null"] }
        invited_by_user_id: { type: [string, "null"], format: uuid }
        created_at: { type: string, format: date-time }
    InvitationEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Invitation" }
    PublicInvitation:
      type: object
      required: [school, email, roles, expires_at, account_exists]
      properties:
        school:
          type: object
          required: [name]
          properties:
            name: { type: string }
        email: { type: string, description: "Email tersamar, mis. g***@contoh.test." }
        roles:
          type: array
          description: "Nama peran yang ditampilkan, bukan kode."
          items: { type: string }
        expires_at: { type: string, format: date-time }
        account_exists: { type: boolean }
    MyInvitation:
      type: object
      required: [id, school, roles, expires_at]
      properties:
        id: { type: string, format: uuid }
        school:
          type: object
          properties:
            name: { type: [string, "null"] }
        roles:
          type: array
          items: { $ref: "#/components/schemas/Role" }
        expires_at: { type: string, format: date-time }
    ReasonRequired:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5 }
    ReasonOptional:
      type: object
      properties:
        reason: { type: [string, "null"] }
    AuditLog:
      type: object
      required: [id, action, entity_type, entity_id, reason, before, after, actor, request_id, created_at]
      properties:
        id: { type: string }
        action: { type: string }
        entity_type: { type: string }
        entity_id: { type: [string, "null"] }
        reason: { type: [string, "null"] }
        before: { type: [object, "null"], additionalProperties: true }
        after: { type: [object, "null"], additionalProperties: true }
        actor:
          type: object
          properties:
            type: { type: string }
            user_id: { type: [string, "null"] }
            name: { type: [string, "null"] }
        request_id: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    TeacherStatus:
      type: string
      enum: [active, inactive]
    ClassStatus:
      type: string
      enum: [active, archived]
    AcademicYear:
      type: object
      required: [id, name, start_date, end_date, is_active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        is_active: { type: boolean }
    AcademicYearEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/AcademicYear" }
    AcademicYearCreate:
      type: object
      required: [name, start_date, end_date]
      properties:
        name: { type: string, maxLength: 100 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, description: "Harus setelah start_date." }
    AcademicYearUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
    Teacher:
      type: object
      required: [id, full_name, employee_number, status, account]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        employee_number: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/TeacherStatus" }
        account:
          description: "Akun login guru; null bila guru tidak punya akun."
          type: [object, "null"]
          required: [membership_id, name, email, status]
          properties:
            membership_id: { type: string, format: uuid }
            name: { type: string }
            email: { type: string, format: email }
            status: { $ref: "#/components/schemas/MembershipStatus" }
    TeacherEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Teacher" }
    TeacherCreate:
      type: object
      required: [full_name]
      properties:
        full_name: { type: string, maxLength: 200 }
        employee_number: { type: [string, "null"], maxLength: 50 }
        membership_id: { type: [string, "null"], format: uuid, description: "Keanggotaan sekolah yang belum berakhir; satu akun untuk satu guru." }
    TeacherUpdate:
      type: object
      properties:
        full_name: { type: string, maxLength: 200 }
        employee_number: { type: [string, "null"], maxLength: 50 }
        membership_id: { type: [string, "null"], format: uuid }
        status: { $ref: "#/components/schemas/TeacherStatus" }
    SchoolClass:
      type: object
      required: [id, name, grade_level, status, academic_year, homeroom_teacher]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        grade_level: { type: integer, minimum: 1, maximum: 13 }
        status: { $ref: "#/components/schemas/ClassStatus" }
        academic_year:
          type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        homeroom_teacher:
          type: [object, "null"]
          required: [id, full_name]
          properties:
            id: { type: string, format: uuid }
            full_name: { type: string }
    ClassEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/SchoolClass" }
    ClassCreate:
      type: object
      required: [academic_year_id, name, grade_level]
      properties:
        academic_year_id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        grade_level: { type: integer, minimum: 1, maximum: 13 }
        homeroom_teacher_id: { type: [string, "null"], format: uuid, description: "Harus guru aktif di sekolah ini." }
    ClassUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        grade_level: { type: integer, minimum: 1, maximum: 13 }
        homeroom_teacher_id: { type: [string, "null"], format: uuid }
        status: { $ref: "#/components/schemas/ClassStatus" }
    StudentStatus:
      type: string
      enum: [active, inactive, graduated, transferred]
    Student:
      type: object
      required: [id, student_number, nisn, full_name, date_of_birth, status, current_class]
      properties:
        id: { type: string, format: uuid }
        student_number: { type: string, description: "Nomor induk siswa (NIS), unik per sekolah." }
        nisn: { type: [string, "null"], description: "10 digit angka." }
        full_name: { type: string }
        date_of_birth: { type: [string, "null"], format: date }
        status: { $ref: "#/components/schemas/StudentStatus" }
        current_class:
          description: "Kelas yang berlaku hari ini (zona waktu sekolah); null bila tidak ada."
          type: [object, "null"]
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
    Enrollment:
      type: object
      required: [id, class, start_date, end_date]
      properties:
        id: { type: string, format: uuid }
        class:
          type: object
          required: [id, name, academic_year]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            academic_year: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: [string, "null"], format: date, description: "Null = masih berlangsung." }
    StudentDetail:
      allOf:
        - $ref: "#/components/schemas/Student"
        - type: object
          required: [enrollments]
          properties:
            enrollments:
              type: array
              description: "Riwayat penempatan, terlama dulu."
              items: { $ref: "#/components/schemas/Enrollment" }
    StudentDetailEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/StudentDetail" }
    StudentCreate:
      type: object
      required: [student_number, full_name]
      properties:
        student_number: { type: string, maxLength: 50 }
        nisn: { type: [string, "null"], pattern: "^[0-9]{10}$" }
        full_name: { type: string, maxLength: 200 }
        date_of_birth: { type: [string, "null"], format: date }
    StudentUpdate:
      type: object
      properties:
        student_number: { type: string, maxLength: 50 }
        nisn: { type: [string, "null"], pattern: "^[0-9]{10}$" }
        full_name: { type: string, maxLength: 200 }
        date_of_birth: { type: [string, "null"], format: date }
        status: { $ref: "#/components/schemas/StudentStatus" }
    EnrollmentCreate:
      type: object
      required: [class_id, start_date]
      properties:
        class_id: { type: string, format: uuid, description: "Kelas aktif di sekolah ini." }
        start_date: { type: string, format: date, description: "Harus dalam tahun ajaran kelas dan setelah mulai penempatan sebelumnya." }
    ImportStatus:
      type: string
      enum: [uploaded, validating, validated, committing, committed, failed, cancelled]
    ImportRowStatus:
      type: string
      enum: [valid, invalid, committed, skipped]
    ImportBatch:
      type: object
      required: [id, status, original_filename, total_rows, valid_rows, invalid_rows, committed_rows, error_message, created_at, committed_at]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/ImportStatus" }
        original_filename: { type: string }
        total_rows: { type: integer }
        valid_rows: { type: integer }
        invalid_rows: { type: integer }
        committed_rows: { type: integer }
        error_message: { type: [string, "null"], description: "Alasan bila status failed." }
        created_at: { type: string, format: date-time }
        committed_at: { type: [string, "null"], format: date-time }
    ImportBatchEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/ImportBatch" }
    ImportRow:
      type: object
      required: [row_number, status, values, errors]
      properties:
        row_number: { type: integer, description: "Nomor baris di file (header = 1)." }
        status: { $ref: "#/components/schemas/ImportRowStatus" }
        values:
          type: object
          description: "Isi sel asli per kolom."
          additionalProperties: { type: [string, "null"] }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
    Holiday:
      type: object
      required: [id, name, start_date, end_date]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, description: "Inklusif." }
    HolidayEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Holiday" }
    HolidayCreate:
      type: object
      required: [name, start_date, end_date]
      properties:
        name: { type: string, maxLength: 150 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date, description: "Tidak boleh sebelum start_date." }
    HolidayUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 150 }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
    ScheduleScope:
      type: string
      enum: [school, grade_level, class]
    Schedule:
      type: object
      required: [id, scope_type, grade_level, class, day_of_week, check_in_start, check_in_deadline, late_grace_minutes, check_out_start, scheduled_check_out, effective_from, effective_until, is_active]
      properties:
        id: { type: string, format: uuid }
        scope_type: { $ref: "#/components/schemas/ScheduleScope" }
        grade_level: { type: [integer, "null"] }
        class:
          type: [object, "null"]
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        day_of_week: { type: integer, minimum: 1, maximum: 7, description: "ISO: 1 = Senin … 7 = Minggu." }
        check_in_start: { type: string, pattern: "^[0-9]{2}:[0-9]{2}$" }
        check_in_deadline: { type: string, pattern: "^[0-9]{2}:[0-9]{2}$" }
        late_grace_minutes: { type: integer, minimum: 0, maximum: 120 }
        check_out_start: { type: string, pattern: "^[0-9]{2}:[0-9]{2}$" }
        scheduled_check_out: { type: string, pattern: "^[0-9]{2}:[0-9]{2}$" }
        effective_from: { type: string, format: date }
        effective_until: { type: [string, "null"], format: date, description: "Null = tanpa batas akhir." }
        is_active: { type: boolean }
    ScheduleEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Schedule" }
    ScheduleListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Schedule" }
    SchedulePublish:
      type: object
      required: [scope_type, days, check_in_start, check_in_deadline, late_grace_minutes, check_out_start, scheduled_check_out, effective_from]
      properties:
        scope_type: { $ref: "#/components/schemas/ScheduleScope" }
        grade_level: { type: integer, minimum: 1, maximum: 13, description: "Wajib untuk scope grade_level; dilarang untuk scope lain." }
        class_id: { type: string, format: uuid, description: "Wajib untuk scope class (kelas aktif); dilarang untuk scope lain." }
        days:
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
          items: { type: integer, minimum: 1, maximum: 7 }
        check_in_start: { type: string, pattern: "^[0-9]{2}:[0-9]{2}$" }
        check_in_deadline: { type: string, pattern: "^[0-9]{2}:[0-9]{2}$" }
        late_grace_minutes: { type: integer, minimum: 0, maximum: 120 }
        check_out_start: { type: string, pattern: "^[0-9]{2}:[0-9]{2}$" }
        scheduled_check_out: { type: string, pattern: "^[0-9]{2}:[0-9]{2}$" }
        effective_from: { type: string, format: date }
    ScheduleUpdate:
      type: object
      properties:
        effective_until: { type: [string, "null"], format: date }
        is_active: { type: boolean }
    CalendarDay:
      type: object
      required: [date, day_of_week, holiday, schedule]
      properties:
        date: { type: string, format: date }
        day_of_week: { type: integer, minimum: 1, maximum: 7 }
        holiday:
          type: [object, "null"]
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
        schedule:
          description: "Jadwal yang berlaku; null pada hari libur atau hari tanpa jadwal."
          oneOf:
            - { $ref: "#/components/schemas/Schedule" }
            - { type: "null" }
    CalendarEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [month, class_id, days]
          properties:
            month: { type: string }
            class_id: { type: [string, "null"], format: uuid }
            days:
              type: array
              items: { $ref: "#/components/schemas/CalendarDay" }
    CredentialStatus:
      type: string
      enum: [active, blocked, revoked]
    Credential:
      type: object
      required: [id, student_id, credential_type, status, status_reason, issued_at, blocked_at, revoked_at, replaces_credential_id]
      properties:
        id: { type: string, format: uuid }
        student_id: { type: string, format: uuid }
        credential_type: { type: string, enum: [qr, rfid] }
        status: { $ref: "#/components/schemas/CredentialStatus" }
        status_reason: { type: [string, "null"] }
        issued_at: { type: string, format: date-time }
        blocked_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        replaces_credential_id: { type: [string, "null"], format: uuid }
    CredentialEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Credential" }
    CredentialListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Credential" }
    CredentialIssuedEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [credential, token]
          properties:
            credential: { $ref: "#/components/schemas/Credential" }
            token: { type: string, pattern: "^SA1\\.[A-Z2-7]{26}$", description: "Nilai QR mentah; hanya terlihat sekali." }
    CredentialClassIssue:
      type: object
      properties:
        mode: { type: string, enum: [missing, all], default: missing }
    CredentialClassIssuedEnvelope:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            type: object
            required: [student, credential, token]
            properties:
              student:
                type: object
                required: [id, student_number, full_name]
                properties:
                  id: { type: string, format: uuid }
                  student_number: { type: string }
                  full_name: { type: string }
              credential: { $ref: "#/components/schemas/Credential" }
              token: { type: string, description: "Nilai QR mentah; hanya terlihat sekali." }
        meta:
          type: object
          required: [issued]
          properties:
            issued: { type: integer }
    DeviceStatus:
      type: string
      enum: [pending_pairing, active, revoked]
    Device:
      type: object
      required: [id, name, device_type, status, online, pairing_expires_at, paired_at, last_seen_at, revoked_at, revoked_reason]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        device_type: { type: string, enum: [gate_terminal] }
        status: { $ref: "#/components/schemas/DeviceStatus" }
        online: { type: boolean, description: "Aktivitas terakhir dalam 2 menit." }
        pairing_expires_at: { type: [string, "null"], format: date-time }
        paired_at: { type: [string, "null"], format: date-time }
        last_seen_at: { type: [string, "null"], format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
        revoked_reason: { type: [string, "null"] }
    DeviceEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Device" }
    DeviceListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Device" }
    DeviceName:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    DevicePairingEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [device, pairing_code]
          properties:
            device: { $ref: "#/components/schemas/Device" }
            pairing_code: { type: string, pattern: "^[A-HJKMNP-Z2-9]{8}$", description: "Hanya terlihat sekali." }
    TerminalPairRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 20, description: "Spasi dan tanda hubung diabaikan; huruf kecil dianggap sama." }
    TerminalPairEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [school]
          properties:
            school:
              type: object
              required: [name]
              properties:
                name: { type: string }
    TerminalConfigEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [school, device, server_time, methods, show_photo]
          properties:
            school:
              type: object
              required: [name, timezone]
              properties:
                name: { type: string }
                timezone: { type: string }
            device:
              type: object
              required: [id, name]
              properties:
                id: { type: string, format: uuid }
                name: { type: string }
            server_time: { type: string, format: date-time }
            methods:
              type: array
              items: { type: string, enum: [qr, rfid] }
            show_photo: { type: boolean }
    TerminalHeartbeatEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [server_time]
          properties:
            server_time: { type: string, format: date-time }
    ScanResult:
      type: string
      enum: [accepted, duplicate, rejected, needs_review]
    TerminalScanRequest:
      type: object
      required: [value, idempotency_key]
      properties:
        value: { type: string, maxLength: 200, description: "Isi QR/kartu mentah dari pemindai." }
        idempotency_key: { type: string, format: uuid, description: "Dibuat klien per scan; dipakai ulang saat mengulang." }
        captured_at: { type: [string, "null"], format: date-time, description: "Hanya informasi diagnostik; tidak dipakai untuk menentukan waktu absensi." }
    TerminalScan:
      type: object
      required: [result, code, event_type, student, recorded_at, recorded_at_local, message]
      properties:
        result: { $ref: "#/components/schemas/ScanResult" }
        code: { type: string, description: "CHECK_IN_OK, CHECK_IN_LATE, CHECK_OUT_OK, CHECK_OUT_EARLY, ALREADY_CHECKED_IN, ALREADY_CHECKED_OUT, TOO_EARLY, CHECKOUT_WITHOUT_CHECKIN, UNKNOWN_CREDENTIAL, CREDENTIAL_BLOCKED, STUDENT_INACTIVE, HOLIDAY, NO_SCHEDULE" }
        event_type: { type: [string, "null"], enum: [check_in, check_out, null] }
        student:
          type: [object, "null"]
          required: [display_name, class_name, photo_url]
          properties:
            display_name: { type: string }
            class_name: { type: [string, "null"] }
            photo_url: { type: [string, "null"] }
        recorded_at: { type: string, format: date-time }
        recorded_at_local: { type: string, example: "07.03" }
        message: { type: string }
    TerminalScanEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/TerminalScan" }
    TerminalRecentEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            type: object
            required: [result, code, event_type, display_name, class_name, is_late, recorded_at_local]
            properties:
              result: { $ref: "#/components/schemas/ScanResult" }
              code: { type: [string, "null"] }
              event_type: { type: [string, "null"] }
              display_name: { type: [string, "null"] }
              class_name: { type: [string, "null"] }
              is_late: { type: [boolean, "null"] }
              recorded_at_local: { type: string }
    AttendanceTodayEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [date, timezone, day, totals, recent, devices]
          properties:
            date: { type: string, format: date }
            timezone: { type: string }
            day:
              type: object
              required: [kind, holiday_name]
              properties:
                kind: { type: string, enum: [school_day, holiday, no_schedule] }
                holiday_name: { type: [string, "null"] }
            totals:
              type: object
              required: [students, present, on_time, late, not_recorded, checked_out]
              properties:
                students: { type: integer }
                present: { type: integer, description: "Hadir + terlambat." }
                on_time: { type: integer }
                late: { type: integer }
                not_recorded: { type: integer }
                checked_out: { type: integer }
            recent:
              type: array
              items:
                type: object
                required: [student_name, class_name, event_type, result, is_late, recorded_at_local]
                properties:
                  student_name: { type: string }
                  class_name: { type: string }
                  event_type: { type: [string, "null"] }
                  result: { $ref: "#/components/schemas/ScanResult" }
                  is_late: { type: [boolean, "null"] }
                  recorded_at_local: { type: string }
            devices:
              type: object
              required: [active, offline]
              properties:
                active: { type: integer }
                offline: { type: integer }

security:
  - sessionCookie: []
