openapi: 3.1.0
info:
  title: Sentra Absensi Sekolah API
  version: 0.1.0
  description: |
    Kontrak API Tahap 1 (auth, tenant, undangan, anggota, audit). Ditulis tangan dan dijaga
    oleh test drift (tests/Feature/OpenApiContractTest.php): setiap rute wajib terdokumentasi
    dan sebaliknya. Klien TypeScript dibangkitkan dari berkas ini (packages/api-client).

    Autentikasi: cookie sesi Sanctum (SPA). Ambil cookie CSRF lewat `GET /sanctum/csrf-cookie`
    (di luar prefiks /api/v1), lalu kirim header `X-XSRF-TOKEN` pada setiap request tulis.
    Semua error berformat RFC 9457 problem+json dengan `code` stabil.
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: me
  - name: platform
  - name: school
  - name: terminal
  - name: invitation

paths:
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: "Masuk dengan email dan password"
      description: "Bila akun memakai 2FA, respons `two_factor: true` dan sesi menunggu `two-factor-challenge`."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: "Berhasil masuk, atau perlu tantangan 2FA."
          content:
            application/json:
              schema:
                type: object
                properties:
                  two_factor: { type: boolean }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/two-factor-challenge:
    post:
      tags: [auth]
      operationId: twoFactorChallenge
      summary: "Selesaikan tantangan 2FA (kode TOTP atau kode pemulihan)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                recovery_code: { type: string }
      responses:
        "204": { description: Berhasil. }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/forgot-password:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: "Minta tautan reset password"
      description: "Selalu 202 apa pun hasilnya, agar tidak bisa dipakai menebak email terdaftar."
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "202":
          description: "Diterima."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/EmailNotConfigured" }
  /auth/reset-password:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: "Tetapkan password baru dengan token reset (sekali pakai, 60 menit)"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password, password_confirmation]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
                password_confirmation: { type: string, format: password }
      responses:
        "200":
          description: "Password diubah."
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: "Keluar"
      responses:
        "204": { description: Berhasil keluar. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: "Profil user yang sedang login"
      responses:
        "200":
          description: "Profil."
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /auth/password:
    put:
      tags: [auth]
      operationId: updatePassword
      summary: "Ganti password"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string, format: password }
                password: { type: string, format: password }
                password_confirmation: { type: string, format: password }
      responses:
        "200": { description: Password diubah. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /auth/confirm-password:
    post:
      tags: [auth]
      operationId: confirmPassword
      summary: "Konfirmasi password untuk aksi sensitif (2FA)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        "201": { description: Terkonfirmasi. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /auth/confirmed-password-status:
    get:
      tags: [auth]
      operationId: getConfirmedPasswordStatus
      summary: "Status konfirmasi password"
      responses:
        "200":
          description: "Status."
          content:
            application/json:
              schema:
                type: object
                properties:
                  confirmed: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /auth/two-factor:
    post:
      tags: [auth]
      operationId: enableTwoFactor
      summary: "Mulai aktivasi 2FA (butuh konfirmasi password)"
      responses:
        "200": { description: Rahasia dibuat; konfirmasi dengan kode TOTP. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "423": { $ref: "#/components/responses/PasswordConfirmationRequired" }
    delete:
      tags: [auth]
      operationId: disableTwoFactor
      summary: "Matikan 2FA (butuh konfirmasi password)"
      responses:
        "200": { description: 2FA dimatikan. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "423": { $ref: "#/components/responses/PasswordConfirmationRequired" }
  /auth/two-factor/confirm:
    post:
      tags: [auth]
      operationId: confirmTwoFactor
      summary: "Konfirmasi aktivasi 2FA dengan kode TOTP"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "200": { description: 2FA aktif. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "423": { $ref: "#/components/responses/PasswordConfirmationRequired" }
  /auth/two-factor/qr-code:
    get:
      tags: [auth]
      operationId: getTwoFactorQrCode
      summary: "SVG kode QR untuk aplikasi authenticator"
      responses:
        "200":
          description: "SVG dan URL."
          content:
            application/json:
              schema:
                type: object
                properties:
                  svg: { type: string }
                  url: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "423": { $ref: "#/components/responses/PasswordConfirmationRequired" }
  /auth/two-factor/secret-key:
    get:
      tags: [auth]
      operationId: getTwoFactorSecretKey
      summary: "Kunci rahasia 2FA untuk input manual"
      responses:
        "200":
          description: "Kunci."
          content:
            application/json:
              schema:
                type: object
                properties:
                  secretKey: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "423": { $ref: "#/components/responses/PasswordConfirmationRequired" }
  /auth/two-factor/recovery-codes:
    get:
      tags: [auth]
      operationId: getRecoveryCodes
      summary: "Daftar kode pemulihan 2FA"
      responses:
        "200":
          description: "Kode pemulihan."
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "423": { $ref: "#/components/responses/PasswordConfirmationRequired" }
    post:
      tags: [auth]
      operationId: regenerateRecoveryCodes
      summary: "Buat ulang kode pemulihan 2FA"
      responses:
        "200": { description: Kode dibuat ulang. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "423": { $ref: "#/components/responses/PasswordConfirmationRequired" }

  /invitations/{token}:
    get:
      tags: [invitation]
      operationId: getInvitationByToken
      summary: "Lihat undangan lewat token dari email"
      description: "Token tidak dikenal, kedaluwarsa, dicabut, dan sudah dipakai menghasilkan respons 410 yang identik."
      security: []
      parameters:
        - $ref: "#/components/parameters/Token"
      responses:
        "200":
          description: "Ringkasan undangan."
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/PublicInvitation" }
        "410": { $ref: "#/components/responses/InvitationUnavailable" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /invitations/{token}/accept:
    post:
      tags: [invitation]
      operationId: acceptInvitationByToken
      summary: "Terima undangan lewat token"
      description: |
        Email baru: wajib `name`, `password`, `password_confirmation`; akun dibuat dan email terverifikasi.
        Email yang sudah terdaftar: wajib login sebagai email itu (401 `LOGIN_REQUIRED`, 403 `INVITATION_EMAIL_MISMATCH`).
      security: []
      parameters:
        - $ref: "#/components/parameters/Token"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 2, maxLength: 150 }
                password: { type: string, format: password }
                password_confirmation: { type: string, format: password }
      responses:
        "201":
          description: "Undangan diterima."
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [school, account_created, email]
                    properties:
                      school: { $ref: "#/components/schemas/SchoolRef" }
                      account_created: { type: boolean }
                      email: { type: string, format: email }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "410": { $ref: "#/components/responses/InvitationUnavailable" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /me/schools:
    get:
      tags: [me]
      operationId: listMySchools
      summary: "Sekolah milik user beserta peran dan izinnya"
      responses:
        "200":
          description: "Daftar sekolah."
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MySchool" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /me/invitations:
    get:
      tags: [me]
      operationId: listMyInvitations
      summary: "Undangan tertunda untuk email user yang login"
      responses:
        "200":
          description: "Daftar undangan."
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/MyInvitation" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
  /me/invitations/{invitation}/accept:
    post:
      tags: [me]
      operationId: acceptMyInvitation
      summary: "Terima undangan milik sendiri"
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "201":
          description: "Diterima."
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [school]
                    properties:
                      school: { $ref: "#/components/schemas/SchoolRef" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/InvitationUnavailable" }
  /me/invitations/{invitation}/decline:
    post:
      tags: [me]
      operationId: declineMyInvitation
      summary: "Tolak undangan milik sendiri"
      parameters:
        - $ref: "#/components/parameters/InvitationId"
      responses:
        "204": { description: Ditolak. }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/NotFound" }
        "410": { $ref: "#/components/responses/InvitationUnavailable" }

  /platform/schools:
    get:
      tags: [platform]
      operationId: listSchools
      summary: "Daftar semua sekolah (Super Admin)"
      parameters:
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: "Halaman sekolah."
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/School" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [platform]
      operationId: createSchool
      summary: "Buat sekolah (Super Admin)"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolCreate" }
      responses:
        "201":
          description: "Sekolah dibuat."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /platform/schools/{school}:
    get:
      tags: [platform]
      operationId: getSchool
      summary: "Detail sekolah (Super Admin)"
      parameters:
        - $ref: "#/components/parameters/SchoolCode"
      responses:
        "200":
          description: "Sekolah."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [platform]
      operationId: updateSchool
      summary: "Ubah profil sekolah (kode dan status tidak bisa diubah di sini)"
      parameters:
        - $ref: "#/components/parameters/SchoolCode"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolUpdate" }
      responses:
        "200":
          description: "Sekolah diubah."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /platform/schools/{school}/suspend:
    post:
      tags: [platform]
      operationId: suspendSchool
      summary: "Tangguhkan sekolah (alasan wajib)"
      parameters:
        - $ref: "#/components/parameters/SchoolCode"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequired" }
      responses:
        "200":
          description: "Ditangguhkan."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /platform/schools/{school}/activate:
    post:
      tags: [platform]
      operationId: activateSchool
      summary: "Aktifkan kembali sekolah yang ditangguhkan"
      parameters:
        - $ref: "#/components/parameters/SchoolCode"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonOptional" }
      responses:
        "200":
          description: "Diaktifkan."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SchoolEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /platform/schools/{school}/invitations:
    post:
      tags: [platform]
      operationId: inviteFirstSchoolAdmin
      summary: "Undang Admin Sekolah pertama (peran selalu school_admin)"
      parameters:
        - $ref: "#/components/parameters/SchoolCode"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "201":
          description: "Undangan dibuat dan dititipkan ke layanan email."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "503": { $ref: "#/components/responses/EmailNotConfigured" }

  /schools/{school}:
    get:
      tags: [school]
      operationId: getSchoolProfile
      summary: "Profil sekolah dengan peran dan izin user saat ini"
      description: "Izin: school.profile.view."
      parameters:
        - $ref: "#/components/parameters/SchoolCode"
      responses:
        "200":
          description: "Profil."
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SchoolProfile" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [school]
      operationId: updateSchoolProfile
      summary: "Ubah profil sekolah"
      description: "Izin: school.profile.update."
      parameters:
        - $ref: "#/components/parameters/SchoolCode"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SchoolUpdate" }
      responses:
        "200":
          description: "Profil diubah."
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: "#/components/schemas/SchoolProfile" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /schools/{school}/members:
    get:
      tags: [school]
      operationId: listMembers
      summary: "Daftar anggota sekolah"
      description: "Izin: school.members.view."
      parameters:
        - $ref: "#/components/parameters/SchoolCode"
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/MembershipStatus" }
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          description: "Halaman anggota."
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Member" }
                  meta: { $ref: "#/components/schemas/PageMeta" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /schools/{school}/members/{membership}:
    get:
      tags: [school]
      operationId: getMember
      summary: "Detail anggota"
      description: "Izin: school.members.view."
      parameters:
        - $ref: "#/components/parameters/SchoolCode"
        - $ref: "#/components/parameters/MembershipId"
      responses:
        "200":
          description: "Anggota."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /schools/{school}/members/{membership}/roles:
    put:
      tags: [school]
      operationId: replaceMemberRoles
      summary: "Ganti seluruh peran anggota (alasan wajib; tidak bisa untuk diri sendiri)"
      description: "Izin: school.members.manage."
      parameters:
        - $ref: "#/components/parameters/SchoolCode"
        - $ref: "#/components/parameters/MembershipId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roles, reason]
              properties:
                roles:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { $ref: "#/components/schemas/Role" }
                reason: { type: string, minLength: 5 }
      responses:
        "200":
          description: "Peran diganti."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /schools/{school}/members/{membership}/suspend:
    post:
      tags: [school]
      operationId: suspendMember
      summary: "Tangguhkan anggota (alasan wajib)"
      description: "Izin: school.members.manage. Admin aktif terakhir tidak bisa ditangguhkan (409 LAST_SCHOOL_ADMIN)."
      parameters:
        - $ref: "#/components/parameters/SchoolCode"
        - $ref: "#/components/parameters/MembershipId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReasonRequired" }
      responses:
        "200":
          description: "Ditangguhkan."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberEnvelope" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /schools/{school}/members/{membership}/reactivate:
    post:
      tags: [school]
      operationId: reactivateMember
      summary: "Aktifkan kembali anggota yang ditangguhkan"
      description: "Izin: school.members.manage."
      parameters:
