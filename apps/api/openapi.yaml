            request_id: { type: [string, "null"], format: uuid }
            student_id: { type: string, format: uuid }
            attendance_date: { type: string, format: date }
            adjustment_type: { type: string, enum: [status_change, early_leave_decision, check_in_time, check_out_time] }
            from: { type: object, additionalProperties: true }
            to: { type: object, additionalProperties: true }
    CorrectionHistoryItem:
      type: object
      required: [id, attendance_date, student_name, adjustment_type, from, to, reason, status, requested_by, decided_by, created_at]
      properties:
        id: { type: string, format: uuid }
        attendance_date: { type: string, format: date }
        student_name: { type: string }
        adjustment_type: { type: string, enum: [status_change, check_in_time, check_out_time, early_leave_decision, review_resolution] }
        from: { type: [object, "null"], additionalProperties: true }
        to: { type: [object, "null"], additionalProperties: true }
        reason: { type: string }
        status: { type: string, enum: [pending, approved, rejected] }
        requested_by: { type: string }
        decided_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    CorrectionHistoryEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/CorrectionHistoryItem" }
    ExportRequestBody:
      type: object
      required: [report, format, filters]
      properties:
        report: { type: string, enum: [summary, students, lateness, daily, monthly, events] }
        format: { type: string, enum: [csv, xlsx, pdf] }
        filters:
          type: object
          description: "Sama dengan parameter laporan terkait (from/to/class_id/grade_level, atau date, atau month+class_id, atau from/to/result untuk events)."
          additionalProperties: true
    Export:
      type: object
      required: [id, report, format, status, row_count, file_size, error_message, created_at, expires_at, download_url]
      properties:
        id: { type: string, format: uuid }
        report: { type: string, enum: [summary, students, lateness, daily, monthly, events] }
        format: { type: string, enum: [csv, xlsx, pdf] }
        status: { type: string, enum: [queued, running, done, failed] }
        row_count: { type: [integer, "null"] }
        file_size: { type: [integer, "null"] }
        error_message: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        download_url: { type: [string, "null"], description: "URL bertanda tangan, berlaku 10 menit." }
    ExportEnvelope:
      type: object
      required: [data]
      properties:
        data: { $ref: "#/components/schemas/Export" }
    ExportListEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Export" }
    ReportMetrics:
      type: object
      required: [effective_days, hadir, terlambat, izin, sakit, dispensasi, alpa, alpa_belum_diverifikasi, belum_tercatat, present, excluded, denominator, attendance_percentage, late_minutes, early_leave]
      properties:
        effective_days: { type: integer }
        hadir: { type: integer }
        terlambat: { type: integer }
        izin: { type: integer }
        sakit: { type: integer }
        dispensasi: { type: integer }
        alpa: { type: integer, description: "Hanya alpa final yang terverifikasi." }
        alpa_belum_diverifikasi: { type: integer }
        belum_tercatat: { type: integer }
        present: { type: integer }
        excluded: { type: integer, description: "izin + sakit + dispensasi" }
        denominator: { type: integer }
        attendance_percentage: { type: [number, "null"], description: "Null bila penyebut nol." }
        late_minutes: { type: integer }
        early_leave:
          type: object
          required: [total, approved, pending, rejected]
          properties:
            total: { type: integer }
            approved: { type: integer }
            pending: { type: integer }
            rejected: { type: integer }
    ReportTrendPoint:
      allOf:
        - { $ref: "#/components/schemas/ReportMetrics" }
        - type: object
          required: [date]
          properties:
            date: { type: string, format: date }
    ReportTrendEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ReportTrendPoint" }
    ReportClassRow:
      allOf:
        - { $ref: "#/components/schemas/ReportMetrics" }
        - type: object
          required: [class_id, class_name, grade_level]
          properties:
            class_id: { type: string, format: uuid }
            class_name: { type: string }
            grade_level: { type: integer }
    ReportStudentRow:
      allOf:
        - { $ref: "#/components/schemas/ReportMetrics" }
        - type: object
          required: [student_id, student_name, student_number]
          properties:
            student_id: { type: string, format: uuid }
            student_name: { type: string }
            student_number: { type: string }
    ReportSummaryEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [from, to, totals, classes]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
            totals: { $ref: "#/components/schemas/ReportMetrics" }
            classes:
              type: array
              items: { $ref: "#/components/schemas/ReportClassRow" }
    ReportStudentsEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ReportStudentRow" }
    ReportLatenessRow:
      type: object
      required: [student_id, student_name, student_number, class_name, late_days, late_minutes]
      properties:
        student_id: { type: string, format: uuid }
        student_name: { type: string }
        student_number: { type: string }
        class_name: { type: string }
        late_days: { type: integer }
        late_minutes: { type: integer }
    ReportLatenessEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ReportLatenessRow" }
    ReportDailyRow:
      type: object
      required: [student_name, student_number, class_name, status, check_in, check_out, late_minutes, early_leave, early_leave_status, corrected]
      properties:
        student_name: { type: string }
        student_number: { type: string }
        class_name: { type: string }
        status: { type: string, enum: [belum_tercatat, hadir, terlambat, izin, sakit, dispensasi, alpa_belum_diverifikasi, alpa] }
        check_in: { type: [string, "null"], description: "HH.MM waktu lokal sekolah" }
        check_out: { type: [string, "null"] }
        late_minutes: { type: [integer, "null"] }
        early_leave: { type: boolean }
        early_leave_status: { type: [string, "null"], enum: [pending, approved, rejected, null] }
        corrected: { type: boolean, description: "Baris pernah dikoreksi/diselesaikan manual." }
    ReportDailyEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ReportDailyRow" }
    ReportMonthlyEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [month, days, students]
          properties:
            month: { type: string }
            days: { type: array, items: { type: string, format: date } }
            students:
              type: array
              items:
                type: object
                required: [student_id, student_name, student_number, statuses]
                properties:
                  student_id: { type: string, format: uuid }
                  student_name: { type: string }
                  student_number: { type: string }
                  statuses:
                    type: array
                    description: "Sejajar dengan days; null = bukan hari sekolah bagi kelas itu."
                    items: { type: [string, "null"] }
    ReportEventRow:
      type: object
      required: [occurred_at, result, reason_code, method, event_type, student_name, device_name]
      properties:
        occurred_at: { type: string, description: "YYYY-MM-DD HH:MM waktu lokal sekolah" }
        result: { type: string, enum: [duplicate, rejected, needs_review] }
        reason_code: { type: [string, "null"] }
        method: { type: string, enum: [qr, rfid, assisted_manual] }
        event_type: { type: [string, "null"] }
        student_name: { type: [string, "null"] }
        device_name: { type: [string, "null"] }
    ReportEventsEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ReportEventRow" }
    ReviewQueueEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/ReviewQueueItem" }
    ResolveReviewRequest:
      type: object
      required: [decision, reason]
      properties:
        decision: { type: string, enum: [accept, reject] }
        reason: { type: string, minLength: 10, maxLength: 500 }
    ResolveReviewEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [event_id, decision, adjustment_id]
          properties:
            event_id: { type: string, format: uuid }
            decision: { type: string, enum: [accept, reject] }
            adjustment_id: { type: string, format: uuid }
    AssistReportEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [from, to, total, by_officer, by_student, by_reason]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
            total: { type: integer }
            by_officer:
              type: array
              items:
                type: object
                required: [officer_name, total, check_outs]
                properties:
                  officer_name: { type: string }
                  total: { type: integer }
                  check_outs: { type: integer }
            by_student:
              type: array
              items:
                type: object
                required: [student_name, total]
                properties:
                  student_name: { type: string }
                  total: { type: integer }
            by_reason:
              type: array
              items:
                type: object
                required: [reason_code, total]
                properties:
                  reason_code: { type: string }
                  total: { type: integer }

security:
  - sessionCookie: []
