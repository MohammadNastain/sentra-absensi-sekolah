# Docker Compose — lingkungan PENGEMBANGAN LOKAL Sentra Absensi Sekolah.
# Bukan konfigurasi produksi. Secret dibaca dari .env (lihat .env.example).
#
#   node scripts/init-env.mjs        # sekali, membuat .env
#   docker compose up -d --wait      # PostgreSQL + Redis
#   bash scripts/verify-dev-env.sh   # verifikasi lingkungan
#
# Service `php` memakai profile "api" dan baru dipakai mulai Tahap 1 (Laravel di apps/api).

name: ${COMPOSE_PROJECT_NAME:-sentra}

services:
  postgres:
    image: postgres:18.6-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?jalankan scripts/init-env.mjs untuk membuat .env}
      POSTGRES_DB: postgres
      # --auth-host: image resmi memakai "trust" untuk loopback; semua koneksi TCP wajib password.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale-provider=builtin --builtin-locale=C.UTF-8 --auth-host=scram-sha-256"
      SENTRA_DB_OWNER_PASSWORD: ${SENTRA_DB_OWNER_PASSWORD:?jalankan scripts/init-env.mjs}
      SENTRA_DB_APP_PASSWORD: ${SENTRA_DB_APP_PASSWORD:?jalankan scripts/init-env.mjs}
    command:
      - postgres
      - -c
      - timezone=UTC
      - -c
      - log_timezone=UTC
      - -c
      - log_min_duration_statement=500
    ports:
      - "127.0.0.1:${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18+: volume di /var/lib/postgresql (PGDATA = /var/lib/postgresql/18/docker)
      - postgres-data:/var/lib/postgresql
      - ./infra/docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Lewat TCP agar tidak "sehat" saat server sementara initdb masih berjalan (hanya socket).
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d sentra"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:8.2.10-alpine3.22
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?jalankan scripts/init-env.mjs}
      - --appendonly
      - "no"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.2
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FORWARD_MAILPIT_UI_PORT:-8025}:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_MAX_MESSAGES: "500"

  # Laravel API (apps/api). Composer & artisan HANYA dijalankan di container ini:
  #   docker compose run --rm api composer install
  #   docker compose run --rm api php artisan test
  api:
    profiles: ["api"]
    build:
      context: ./infra/docker/php
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    image: sentra/php-dev:8.5
    working_dir: /var/www/api
    # Server bawaan PHP langsung (bukan `artisan serve`): artisan serve tidak meneruskan DB_HOST dkk. ke worker,
    # sehingga Laravel jatuh ke 127.0.0.1 dan gagal terhubung ke PostgreSQL di container lain.
    command: ["sh", "-c", "cd public && exec php -S 0.0.0.0:8000 ../vendor/laravel/framework/src/Illuminate/Foundation/resources/server.php"]
    ports:
      - "127.0.0.1:${FORWARD_API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/var/www/api
      # vendor/ di named volume: cepat di Windows & tidak bertabrakan dengan host (ADR 0007 D-41)
      - api-vendor:/var/www/api/vendor
    environment:
      PHP_CLI_SERVER_WORKERS: "4"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USERNAME: sentra_app
      DB_PASSWORD: ${SENTRA_DB_APP_PASSWORD}
      DB_MIGRATION_USERNAME: sentra_owner
      DB_MIGRATION_PASSWORD: ${SENTRA_DB_OWNER_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  api-vendor:
